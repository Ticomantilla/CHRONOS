name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Native Android APK with Real Alarm Stream
        run: |
          npm install -g @capacitor/cli@6 @capacitor/core@6
          mkdir -p chronos-app && cd chronos-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init CHRONOS com.cyberdin.chronos --web-dir www
          mkdir -p www
          curl -sL "https://litter.catbox.moe/vqwow4.zip" -o dist.zip
          unzip -o dist.zip -d www/
          npx cap add android

          # Copiar el sonido a la carpeta res/raw nativa
          mkdir -p android/app/src/main/res/raw
          cp www/alarm_sound.wav android/app/src/main/res/raw/alarm_sound.wav

          # Reemplazar iconos oficiales por el icono de CHRONOS
          find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp www/pwa-192x192.png {} \;

          # Permisos de sistema para alarmas exactas y pantalla bloqueada
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST

          # Inyectar canal nativo con AudioAttributes.USAGE_ALARM en MainActivity.java
          MAIN_ACTIVITY="android/app/src/main/java/com/cyberdin/chronos/MainActivity.java"
          sed -i '/public class MainActivity extends BridgeActivity {/a \    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {\n            android.app.NotificationChannel channel = new android.app.NotificationChannel(\n                "chronos_alarm_channel_v5",\n                "Alarma Despertador CHRONOS",\n                android.app.NotificationManager.IMPORTANCE_HIGH\n            );\n            channel.setDescription("Alarma real con parlante abierto");\n            android.net.Uri soundUri = android.net.Uri.parse("android.resource://" + getPackageName() + "/" + com.cyberdin.chronos.R.raw.alarm_sound);\n            android.media.AudioAttributes audioAttributes = new android.media.AudioAttributes.Builder()\n                .setContentType(android.media.AudioAttributes.CONTENT_TYPE_SONIFICATION)\n                .setUsage(android.media.AudioAttributes.USAGE_ALARM)\n                .build();\n            channel.setSound(soundUri, audioAttributes);\n            channel.enableVibration(true);\n            android.app.NotificationManager manager = getSystemService(android.app.NotificationManager.class);\n            if (manager != null) manager.createNotificationChannel(channel);\n        }\n    }' $MAIN_ACTIVITY

          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHRONOS-v3.4-AlarmStream
          path: chronos-app/android/app/build/outputs/apk/debug/*.apk
