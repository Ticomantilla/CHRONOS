name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Native Android APK
        run: |
          npm install -g @capacitor/cli@6 @capacitor/core@6
          mkdir -p chronos-app && cd chronos-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npx cap init CHRONOS com.cyberdin.chronos --web-dir www
          mkdir -p www
          curl -sL "https://files.catbox.moe/p4uxpg.zip" -o dist.zip
          unzip -o dist.zip -d www/
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHRONOS-v2.5-Native
          path: chronos-app/android/app/build/outputs/apk/debug/*.apk
