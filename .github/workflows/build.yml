name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create Project & Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npm install -g cordova@12.0.0
          cordova create app com.cyberdin.chronos CHRONOS
          cd app
          rm -rf www/*
          curl -L -o www.zip "https://files.catbox.moe/dbgnfh.zip"
          unzip www.zip -d www/
          cordova platform add android@12.0.0
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHRONOS-Native-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
