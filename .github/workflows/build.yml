name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Native Android APK with Continuous Alarm
        run: |
          npm install -g @capacitor/cli@6 @capacitor/core@6
          mkdir -p chronos-app && cd chronos-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init CHRONOS com.cyberdin.chronos --web-dir www
          mkdir -p www
          curl -sL "https://files.catbox.moe/z18v6n.zip" -o dist.zip
          unzip -o dist.zip -d www/
          npx cap add android

          # Copiar el sonido nativo de sirena a res/raw
          mkdir -p android/app/src/main/res/raw
          cp www/alarm_sound.wav android/app/src/main/res/raw/alarm_sound.wav

          # Reemplazar iconos por el icono oficial de CHRONOS
          find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp www/pwa-192x192.png {} \;

          # Permisos para pantalla bloqueada y alarmas exactas
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST

          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHRONOS-v3.7-AlarmaIninterrumpida
          path: chronos-app/android/app/build/outputs/apk/debug/*.apk
